<svg width="1800" height="460" viewBox="0 0 1800 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metalGradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#F5F8FB"/>
      <stop offset="10%" stop-color="#C4CCD6"/>
      <stop offset="20%" stop-color="#EEF4F9"/>
      <stop offset="35%" stop-color="#2B3138"/>
      <stop offset="50%" stop-color="#F3F6F9"/>
      <stop offset="63%" stop-color="#5F6977"/>
      <stop offset="82%" stop-color="#F6F9FC"/>
