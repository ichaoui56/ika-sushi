    <path d="M 560 330 C 700 370, 860 360, 1000 326 C 1114 298, 1200 236, 1270 205" stroke="url(#swooshGradient)" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M 430 318 C 492 350, 548 344, 608 326" stroke="url(#swooshGradient)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8"/>
